# Database connection settings (The values match the Docker command in your instructions)
spring.datasource.url=jdbc:postgresql://citizenreport-postgres:5432/citizenreport
spring.datasource.username=postgres
spring.datasource.password=password

# Driver and JPA/Hibernate settings (optional, but common)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true