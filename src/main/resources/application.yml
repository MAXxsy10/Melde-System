spring:
  application:
    name: citizen-report-platform
  # datasource:
  #  url: jdbc:postgresql://localhost:5432/citizenreport
  # username: postgres
  #  password: password
  #  driver-class-name: org.postgresql.Driver
    datasource:
      url: jdbc:postgresql://citizenreport-postgres:5432/citizenreport
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create  #at the start
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    secret: ThisIsAVerySecureSecretKeyForJWTTokenGenerationWithAtLeast256Bits
    expiration: 86400000

  file:
    upload-dir: ./uploads

logging:
  level:
    com.citizenreport: DEBUG