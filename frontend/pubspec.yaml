name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Default Icons
  cupertino_icons: ^1.0.8

  # Networking & Auth
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  stomp_dart_client: ^3.0.0

  # Map & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # UI & Utilities
  intl: ^0.19.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true